name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar con CMake
        run: cmake -S . -B build -A x64

      - name: Compilar en Release
        run: cmake --build build --config Release --parallel

      - name: Guardar los plugins compilados
        uses: actions/upload-artifact@v4
        with:
          name: Heaven-Limits-Windows-Release
          path: build/HeavenLimits_artefacts/Release/
          if-no-files-found: error
